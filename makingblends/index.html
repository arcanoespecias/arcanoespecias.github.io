<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0E0A07">
  <meta name="robots" content="noindex, nofollow">
  <title>Making Blends — Arcano Especias</title>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/makingblends.css?v=1">
</head>
<body>
  <!-- Pantalla de Login -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <img src="/icons/arcano-logo.webp" alt="Arcano" class="login-logo">
      <h1>Making Blends</h1>
      <p class="login-sub">Panel de producción · Solo personal autorizado</p>
      <input type="password" id="pin-input" class="pin-input" placeholder="• • • •" maxlength="4" inputmode="numeric" autocomplete="off">
      <button class="btn-gold" onclick="App.login()">Ingresar</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </div>

  <!-- App principal -->
  <div id="app" class="app" style="display:none">
    <header class="topbar">
      <div class="topbar-left">
        <img src="/icons/arcano-logo.webp" alt="Arcano" class="topbar-logo">
        <div>
          <div class="topbar-title">Making Blends</div>
          <div class="topbar-sub" id="user-name">—</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn-ghost" onclick="App.logout()">Salir</button>
      </div>
    </header>

    <main class="main">
      <!-- Paso 1: Selección de blend -->
      <section class="step" id="step-1">
        <div class="step-header">
          <span class="step-num">1</span>
          <h2>Elegí el blend a producir</h2>
        </div>
        <div class="blend-search">
          <input type="text" id="blend-search" placeholder="Buscar blend..." oninput="App.renderBlends()">
        </div>
        <div class="blend-grid" id="blend-grid"></div>
      </section>

      <!-- Paso 2: Configuración de producción -->
      <section class="step hidden" id="step-2">
        <div class="step-header">
          <span class="step-num">2</span>
          <h2>Configurá la producción</h2>
          <button class="btn-ghost btn-sm" onclick="App.goStep(1)">← Volver</button>
        </div>
        <div class="config-card">
          <div class="blend-selected">
            <div class="blend-selected-name" id="selected-blend-name">—</div>
            <div class="blend-selected-cat" id="selected-blend-cat">—</div>
          </div>
          <div class="config-row">
            <label>
              <span class="config-label">Tamaño del frasco</span>
              <div class="size-toggle">
                <button class="size-btn active" data-size="chico" onclick="App.setSize('chico')">
                  <span class="size-icon">🫙</span>
                  <span class="size-name">Pequeño</span>
                  <span class="size-weight" id="size-chico-weight">70g</span>
                </button>
                <button class="size-btn" data-size="grande" onclick="App.setSize('grande')">
                  <span class="size-icon">🫙</span>
                  <span class="size-name">Grande</span>
                  <span class="size-weight" id="size-grande-weight">130g</span>
                </button>
              </div>
            </label>
            <label>
              <span class="config-label">Cantidad de frascos</span>
              <div class="qty-selector">
                <button onclick="App.adjustQty(-1)">−</button>
                <input type="number" id="qty-input" value="10" min="1" max="500" oninput="App.onQtyChange()">
                <button onclick="App.adjustQty(1)">+</button>
              </div>
              <div class="qty-presets">
                <button onclick="App.setQty(5)">5</button>
                <button onclick="App.setQty(10)">10</button>
                <button onclick="App.setQty(25)">25</button>
                <button onclick="App.setQty(50)">50</button>
                <button onclick="App.setQty(100)">100</button>
              </div>
            </label>
          </div>
          <div class="config-summary" id="config-summary"></div>
          <div class="step2-actions">
            <button class="btn-gold btn-lg" onclick="App.startProduction()">Iniciar producción →</button>
          </div>
        </div>
      </section>

      <!-- Paso 3: Producción (videojuego) -->
      <section class="step hidden" id="step-3">
        <div class="step-header">
          <span class="step-num">3</span>
          <h2>Producción en curso</h2>
          <button class="btn-ghost btn-sm" onclick="App.goStep(2)">← Volver</button>
        </div>

        <div class="production-layout">
          <!-- Receta -->
          <div class="recipe-panel">
            <h3>Receta total</h3>
            <div class="recipe-meta" id="recipe-meta"></div>
            <div class="recipe-list" id="recipe-list"></div>
            <div class="recipe-total" id="recipe-total"></div>
          </div>

          <!-- Estación de mezclado -->
          <div class="mixing-station">
            <div class="bowl-container">
              <div class="bowl" id="bowl">
                <div class="bowl-content" id="bowl-content"></div>
                <div class="bowl-shine"></div>
              </div>
              <div class="bowl-label" id="bowl-label">Tazón vacío</div>
            </div>

            <div class="progress-section">
              <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
              </div>
              <div class="progress-text" id="progress-text">0 / 0 especias agregadas</div>
            </div>

            <div class="spices-rack" id="spices-rack"></div>

            <div class="production-actions" id="production-actions">
              <button class="btn-ghost" onclick="App.resetProduction()">Reiniciar</button>
              <button class="btn-gold" id="complete-btn" onclick="App.completeProduction()" disabled>Completar blend</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Paso 4: Completado -->
      <section class="step hidden" id="step-4">
        <div class="completion-screen">
          <div class="completion-check">✓</div>
          <h2>¡Blend completado!</h2>
          <div class="completion-blend" id="completion-blend-name"></div>
          <div class="completion-summary" id="completion-summary"></div>
          <div class="completion-actions">
            <button class="btn-ghost" onclick="App.goStep(1)">Hacer otro blend</button>
            <button class="btn-gold" onclick="App.printRecipe()">🖨️ Imprimir receta</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal de peso (para confirmar agregado manual) -->
  <div id="weight-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3 id="weight-modal-title">Agregar especia</h3>
      <div class="modal-spice-name" id="weight-modal-spice">—</div>
      <div class="modal-target">Objetivo: <strong id="weight-modal-target">0g</strong></div>
      <input type="number" id="weight-modal-input" placeholder="Peso real (g)" step="0.1" min="0">
      <div class="modal-actions">
        <button class="btn-ghost" onclick="App.closeWeightModal()">Cancelar</button>
        <button class="btn-gold" onclick="App.confirmWeight()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
