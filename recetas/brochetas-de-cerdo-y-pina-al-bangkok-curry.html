<h1>Brochetas de Cerdo y Piña al Bangkok Curry</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-medium">Media</span>
<span>40 min</span>
<span>4 porciones</span>
<span>2026-09-22</span>
</div>
<div class="content">
<h2>Ingredientes</h2>
<ul><li>2 cucharadas de Bangkok Curry</li><li>600g de lomo de cerdo cortado en cubos</li><li>1/2 taza de leche de coco</li><li>2 tazas de piña fresca en cubos</li><li>1 pimentón rojo cortado en trozos</li><li>1 cebolla morada cortada en cascos</li><li>2 cucharadas de aceite de sésamo</li><li>1 cucharada de jugo de limón</li><li>1 cucharadita de sal fina</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un tazón grande, mezclar la leche de coco, el jugo de limón, el aceite de sésamo, la sal y las 2 cucharadas de Bangkok Curry hasta integrar bien.</li><li>Paso 2: Agregar los cubos de cerdo a la mezcla, asegurando que queden cubiertos, y dejar marinar en refrigeración durante 20 minutos.</li><li>Paso 3: Armar las brochetas alternando en palitos de madera el cerdo marinado, la piña, el pimentón rojo y la cebolla morada.</li><li>Paso 4: Precalentar una parrilla o sartén acanalada a fuego medio-alto y pincelar ligeramente con aceite.</li><li>Paso 5: Cocinar las brochetas de 12 a 15 minutos, girándolas constantemente para dorar el cerdo uniformemente y caramelizar la piña.</li><li>Paso 6: Retirar del fuego y servir de inmediato acompañadas de arroz aromático o ensalada fresca.</li></ol>
</div>
