<body>
<div class="container">
<a href="https://arcanoespecias.com/" class="back">&larr; Volver a la tienda</a>
<h1>Infusión de Bosque Encantado con Frutas Rojas</h1>
<div class="meta">
<span>Infusiones</span>
<span class="badge badge-easy">Facil</span>
<span>20 min</span>
<span>2 porciones</span>
<span>2026-08-10</span>
</div>

<div class="content">
<h2>Ingredientes</h2>
<ul><li>1 cucharadita de Bosque Encantado</li><li>100g de frambuesas frescas</li><li>100g de fresas frescas</li><li>100g de arándanos frescos</li><li>1 cucharadita de miel de abeja</li><li>1 litro de agua caliente</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: Calienta el agua en una tetera y agrégale la cucharadita de Bosque Encantado.</li><li>Paso 2: Deja infusionar durante 5 minutos y luego agrega las frutas rojas frescas.</li><li>Paso 3: Deja reposar durante 10 minutos para que los sabores se mezclen.</li><li>Paso 4: Agrega la cucharadita de miel de abeja y revuelve suavemente.</li><li>Paso 5: Sirve caliente y disfruta de la infusión.</li><li>Paso 6: Puedes acompañar con un poco de azúcar moreno o miel si lo deseas.</li></ol>
</div>

<div class="footer">Arcano Especias &mdash; Especias y Blends artesanales del mundo</div>
</div>
</body>
