<div class="container">
<a href="https://arcanoespecias.github.io/" class="back">&larr; Volver a la tienda</a>
<h1>Costillitas de Cerdo Glaseadas con Bourbon BBQ y Toque Cítrico</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-medium">Media</span>
<span>1 hora 15 min</span>
<span>4 porciones</span>
<span>2026-09-09</span>
</div>
<div class="content">
<h2>Ingredientes</h2>
<ul><li>1.2 kg de costillas de cerdo baby back</li><li>2 cucharadas de Bourbon BBQ</li><li>1 cucharada de Caribbean Citrus</li><li>1/2 taza de salsa de tomate (ketchup)</li><li>2 cucharadas de miel de abejas</li><li>1 cucharada de vinagre de manzana</li><li>2 dientes de ajo picados</li><li>1 cucharada de aceite de oliva</li><li>1 cucharadita de sal fina</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: Precalentar el horno a 180°C y retirar la membrana posterior de las costillas de cerdo.</li><li>Paso 2: En un recipiente, mezclar 1 cucharada de Bourbon BBQ, la sal y el aceite de oliva, y frotar esta preparación por ambos lados de las costillas.</li><li>Paso 3: Envolver el costillar herméticamente en papel aluminio y hornear durante 50 minutos hasta que la carne esté suave.</li><li>Paso 4: Para la salsa, cocinar a fuego bajo en una olla pequeña la salsa de tomate, la miel, el vinagre, el ajo, la otra cucharada de Bourbon BBQ y 1/2 cucharada de Caribbean Citrus durante 8 minutos.</li><li>Paso 5: Retirar las costillas del horno, destapar el papel aluminio y barnizar generosamente la carne con el glaseado preparado.</li><li>Paso 6: Gratinar las costillas descubiertas a 220°C durante 10 minutos hasta que la superficie quede dorada y caramelizada.</li><li>Paso 7: Espolvorear la media cucharada restante de Caribbean Citrus justo antes de servir para resaltar el aroma cítrico.</li></ol>
</div>
