<h1>Pollo al Curry de Bangkok con Verduras</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-easy">Facil</span>
<span>30 min</span>
<span>4 porciones</span>
<span>2026-07-30</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/pollo-al-curry-de-bangkok-con-verduras.jpg" alt="Pollo al Curry de Bangkok con Verduras" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>200g de pollo</li><li>1 cucharadita de Bangkok Curry</li><li>1 cebolla picada</li><li>2 zanahorias picadas</li><li>2 cucharadas de aceite de oliva</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: Calienta el aceite de oliva en una sartén a fuego medio y agrega la cebolla y las zanahorias picadas.</li><li>Paso 2: Agrega el pollo y cocina hasta que esté dorado por todos lados.</li><li>Paso 3: Agrega el Bangkok Curry y revuelve bien para que el pollo y las verduras queden cubiertos con la mezcla de especias.</li><li>Paso 4: Reduce el fuego y cocina durante 10-15 minutos o hasta que el pollo esté cocido y las verduras estén tiernas.</li><li>Paso 5: Sirve caliente y disfruta de este delicioso plato.</li></ol>
</div>
