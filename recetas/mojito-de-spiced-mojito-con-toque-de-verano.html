<h1>Mojito de Spiced Mojito con toque de Verano</h1>
<div class="meta">
<span>Cocteleria</span>
<span class="badge badge-easy">Facil</span>
<span>15 min</span>
<span>2 porciones</span>
<span>2026-08-09</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/mojito-de-spiced-mojito-con-toque-de-verano.jpg" alt="Mojito de Spiced Mojito con toque de Verano" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>2 cucharaditas de azúcar</li><li>1/2 taza de ron blanco</li><li>1/2 taza de jugo de limón</li><li>1/4 taza de soda</li><li>10 hojas de menta fresca</li><li>1 cucharadita de Spiced Mojito de Arcano Especias</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un tazón grande, mezcla el azúcar y el jugo de limón hasta que el azúcar se disuelva.</li><li>Paso 2: Agrega las hojas de menta fresca y machácalas suavemente con un mortero para liberar su esencia.</li><li>Paso 3: Agrega el ron blanco y la cucharadita de Spiced Mojito, y mezcla bien.</li><li>Paso 4: Llena dos vasos altos con hielo y divide la mezcla entre ellos.</li><li>Paso 5: Completa con soda y decora con hojas de menta fresca.</li></ol>
</div>

<div class="footer">Arcano Especias &mdash; Especias y Blends artesanales del mundo</div>
</div>
