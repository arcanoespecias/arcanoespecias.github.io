<body>
<div class="container">
<a href="https://arcanoespecias.com/" class="back">&larr; Volver a la tienda</a>
<h1>Sunset en el Caribe</h1>
<div class="meta">
<span>Cocteleria</span>
<span class="badge badge-easy">Facil</span>
<span>20 min</span>
<span>2 porciones</span>
<span>2026-08-10</span>
</div>

<div class="content">
<h2>Ingredientes</h2>
<ul><li>1 cucharadita de Whisky Oak Spice de Arcano</li><li>50ml de ron dorado</li><li>20ml de jugo de naranja fresco</li><li>10ml de jugo de limón fresco</li><li>1 cucharada de miel de abeja</li><li>Hielo</li><li>Rodajas de naranja para decorar</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un shaker, mezcla el Whisky Oak Spice de Arcano con el ron dorado, el jugo de naranja fresco y el jugo de limón fresco.</li><li>Paso 2: Agrega la miel de abeja y llena el shaker con hielo.</li><li>Paso 3: Agita vigorosamente durante 10-15 segundos para combinar y enfriar los ingredientes.</li><li>Paso 4: Cuela el coctel en dos vasos altos llenos de hielo.</li><li>Paso 5: Decora cada vaso con una rodaja de naranja y sirve de inmediato.</li><li>Paso 6: Disfruta del Sunset en el Caribe y deja que el sabor te transporte a un paraíso tropical.</li></ol>
</div>

<div class="footer">Arcano Especias &mdash; Especias y Blends artesanales del mundo</div>
</div>
</body>
