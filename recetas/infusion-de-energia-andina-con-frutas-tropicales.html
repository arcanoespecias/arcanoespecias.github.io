<h1>Infusión de Energía Andina con Frutas Tropicales</h1>
<div class="meta">
<span>Infusiones</span>
<span class="badge badge-easy">Facil</span>
<span>20 min</span>
<span>4 porciones</span>
<span>2026-08-11</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/infusion-de-energia-andina-con-frutas-tropicales.jpg" alt="Infusión de Energía Andina con Frutas Tropicales" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>1 cucharadita de Energía Andina</li><li>200g de piña fresca</li><li>100g de mango fresco</li><li>100g de fresas frescas</li><li>500ml de agua</li><li>1 cucharadita de miel de abeja</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: Lava y pica la piña, el mango y las fresas en trozos pequeños.</li><li>Paso 2: En un tazón grande, mezcla los trozos de fruta con la cucharadita de Energía Andina.</li><li>Paso 3: Agrega el agua y mezcla bien para combinar los sabores.</li><li>Paso 4: Deja reposar la mezcla durante 10 minutos para que las especias y los sabores se integren.</li><li>Paso 5: Agrega la miel de abeja y mezcla suavemente.</li><li>Paso 6: Sirve la infusión en vasos altos y decora con rodajas de fruta fresca.</li><li>Paso 7: Disfruta de esta deliciosa y revitalizante infusión</li></ol>
</div>
