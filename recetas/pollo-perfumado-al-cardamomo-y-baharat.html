<h1>Pollo Perfumado al Cardamomo y Baharat</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-medium">Media</span>
<span>50 min</span>
<span>4 porciones</span>
<span>2026-09-22</span>
</div>
<div class="content">
<h2>Ingredientes</h2>
<ul><li>800g de muslos de pollo desosados</li><li>1 cucharadita de Baharat</li><li>1 cucharadita de semillas de cardamomo verde trituradas</li><li>2 cucharadas de aceite de oliva</li><li>1/2 taza de jugo de naranja fresca</li><li>1 cucharadita de ralladura de naranja</li><li>2 dientes de ajo picados</li><li>1/2 cucharadita de sal marina</li><li>1/4 taza de almendras fileteadas tostadas</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un tazón grande, mezcla el aceite de oliva, el jugo de naranja, la ralladura y los dientes de ajo picados.</li><li>Paso 2: Agrega la cucharadita de Baharat, el cardamomo verde triturado y la sal marina para formar la marinada especiada.</li><li>Paso 3: Integra los muslos de pollo en la marinada, asegurando que queden bien cubiertos, y deja reposar a temperatura ambiente por 20 minutos.</li><li>Paso 4: Precalienta el horno a 200 °C y acomoda el pollo junto con la marinada en una bandeja apta para horno.</li><li>Paso 5: Hornea durante 30 a 35 minutos hasta que el pollo esté tierno y la superficie quede ligeramente dorada.</li><li>Paso 6: Sirve el pollo bañándolo con sus propios jugos de cocción y decora con las almendras fileteadas tostadas.</li></ol>
</div>
