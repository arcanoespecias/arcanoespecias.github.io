<h1>Pollo al Adobo Colombiano</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-easy">Facil</span>
<span>45 min</span>
<span>4 porciones</span>
<span>2026-07-31</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/pollo-al-adobo-colombiano.jpg" alt="Pollo al Adobo Colombiano" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>200g de pollo</li><li>2 cucharaditas de Adobo Colombiano de Arcano Especias</li><li>1 cucharadita de ajo picado</li><li>1 cucharadita de aceite de oliva</li><li>1 limón</li><li>Sal al gusto</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: Mezcla el Adobo Colombiano con el ajo picado y el jugo de limón en un tazón pequeño.</li><li>Paso 2: Coloca el pollo en un recipiente grande y unte la mezcla de adobo sobre el pollo, asegurándote de cubrirlo completamente.</li><li>Paso 3: Calienta el aceite de oliva en una sartén a fuego medio y cocina el pollo hasta que esté dorado por todos lados.</li><li>Paso 4: Reduce el fuego a bajo y cocina durante 20 minutos o hasta que el pollo esté cocido y tierno.</li><li>Paso 5: Sazona con sal al gusto y sirve caliente.</li></ol>
</div>
