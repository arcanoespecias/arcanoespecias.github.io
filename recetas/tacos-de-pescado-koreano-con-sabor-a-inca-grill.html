<a href="https://arcanoespecias.com/" class="back">&larr; Volver a la tienda</a>
<h1>Tacos de Pescado Koreano con Sabor a Inca Grill</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-easy">Facil</span>
<span>25 min</span>
<span>4 porciones</span>
<span>2026-08-10</span>
</div>

<div class="content">
<h2>Ingredientes</h2>
<ul><li>1 cucharadita de Inca Grill</li><li>400g de filete de pescado blanco</li><li>1/2 taza de salsa de soja</li><li>1/4 taza de aceite de sésamo</li><li>2 cucharadas de miel</li><li>1 cebolla picada</li><li>2 dientes de ajo picados</li><li>1/4 taza de cilantro fresco picado</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un tazón grande, mezcla el Inca Grill, la salsa de soja, el aceite de sésamo, la miel, la cebolla y el ajo para crear la marinada.</li><li>Paso 2: Agrega el filete de pescado a la marinada y refrigera por al menos 10 minutos.</li><li>Paso 3: Precalienta una sartén a fuego medio-alto y cocina el pescado durante 3-4 minutos por lado, hasta que esté cocido.</li><li>Paso 4: Calienta tortillas de maíz en una sartén seca o en el microondas.</li><li>Paso 5: Sirve el pescado en las tortillas calientes y agrega salsa picante, cilantro fresco y cualquier otro topping deseado.</li><li>Paso 6: Decora con rodajas de limón y sirve inmediatamente.</li></ol>
</div>
