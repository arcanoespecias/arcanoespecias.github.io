<div class="container">

<h1>Infusión de Moscú</h1>
<div class="meta">
<span>Infusiones</span>
<span class="badge badge-easy">Facil</span>
<span>20 min</span>
<span>2 porciones</span>
<span>2026-08-08</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/infusion-de-moscu.jpg" alt="Infusión de Moscú" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>1 cucharadita de Moscow Mule Blend de Arcano Especias</li><li>1 litro de agua</li><li>1/2 taza de jugo de limón fresco</li><li>1/4 taza de miel</li><li>Hielo</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En una olla, combina el agua y el Moscow Mule Blend de Arcano Especias. Calienta a fuego lento durante 5 minutos.</li><li>Paso 2: Agrega el jugo de limón fresco y la miel. Revuelve hasta que la miel se disuelva.</li><li>Paso 3: Retira del fuego y deja enfriar.</li><li>Paso 4: Sirve la infusión fría con hielo y decora con rodajas de limón.</li></ol>
</div>

<div class="footer">Arcano Especias &mdash; Especias y Blends artesanales del mundo</div>
</div>
</body>
