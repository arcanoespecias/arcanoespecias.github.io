<h2>Ingredientes</h2>
<ul><li>1 cucharadita de Ají Andino</li><li>1 cucharadita de hierbas frescas de menta</li><li>1 cucharadita de miel de abeja</li><li>1 taza de agua hirviendo</li><li>1 rodaja de limón</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un infusor, mezcla el Ají Andino y las hierbas frescas de menta.</li><li>Paso 2: Agrega el agua hirviendo al infusor y deja reposar durante 5 minutos.</li><li>Paso 3: Agrega la miel de abeja y revuelve hasta que se disuelva.</li><li>Paso 4: Sirve el té en una taza y exprime la rodaja de limón para agregar un toque de acidez.</li></ol>
