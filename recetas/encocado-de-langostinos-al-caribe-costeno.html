<h1>Encocado de Langostinos al Caribe Costeño</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-medium">Media</span>
<span>35 min</span>
<span>4 porciones</span>
<span>2026-08-25</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/encocado-de-langostinos-al-caribe-costeno.jpg" alt="Encocado de Langostinos al Caribe Costeño" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>500g de langostinos limpios y pelados</li><li>2 cucharadas de Caribe Costeño</li><li>400ml de leche de coco espesa</li><li>1 pimentón rojo cortado en cubos finos</li><li>1 cebolla morada picada en trozos pequeños</li><li>2 dientes de ajo finamente picados</li><li>1 cucharada de aceite de achiote</li><li>1/2 taza de caldo de pescado</li><li>2 cucharadas de cilantro fresco picado</li><li>1 cucharada de jugo de lima fresca</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un tazón grande, marinar los langostinos con 1 cucharada de Caribe Costeño y el jugo de lima durante 10 minutos.</li><li>Paso 2: Calentar el aceite de achiote en una sartén honda a fuego medio y sofreír la cebolla morada, el pimentón y el ajo durante 5 minutos hasta que estén transparentes.</li><li>Paso 3: Agregar la cucharada restante de Caribe Costeño a los vegetales sofritos y mezclar durante 1 minuto para liberar todo su aroma.</li><li>Paso 4: Verter la leche de coco y el caldo de pescado, integrando bien todos los ingredientes, y dejar hervir a fuego suave por 8 minutos hasta que la salsa espese ligeramente.</li><li>Paso 5: Incorporar los langostinos marinados a la salsa hirviendo y cocinar durante 4 a 5 minutos hasta que estén perfectamente rosados y tiernos.</li><li>Paso 6: Ajustar el punto de sal, retirar del fuego y espolvorear el cilantro fresco picado antes de servir muy caliente.</li></ol>
</div>
