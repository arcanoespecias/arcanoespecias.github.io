<h1>Elixir Cítrico de Ginebra y Flor de Hibisco</h1>
<div class="meta">
<span>Cocteleria</span>
<span class="badge badge-easy">Facil</span>
<span>15 min</span>
<span>2 porciones</span>
<span>2026-08-23</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/elixir-citrico-de-ginebra-y-flor-de-hibisco.jpg" alt="Elixir Cítrico de Ginebra y Flor de Hibisco" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>1 cucharadita de Citrus Gin</li><li>120 ml de ginebra premium</li><li>60 ml de zumo de pomelo rosado recién exprimido</li><li>30 ml de jarabe de flor de hibisco</li><li>30 ml de zumo de limón verde</li><li>100 ml de agua tónica helada</li><li>1 taza de cubos de hielo</li><li>2 rodajas de pomelo rosado para decorar</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un mortero pequeño, machaca levemente la cucharadita de Citrus Gin para liberar sus aceites esenciales aromáticos.</li><li>Paso 2: Vierte las especias machacadas en la coctelera junto con el jarabe de flor de hibisco para infundir el almíbar.</li><li>Paso 3: Agrega la ginebra premium, el zumo de pomelo rosado y el zumo de limón verde a la coctelera.</li><li>Paso 4: Llena la coctelera con abundante hielo y agita enérgicamente durante 15 segundos hasta que el recipiente esté bien frío.</li><li>Paso 5: Sirve la mezcla utilizando un colador fino para distribuirla en dos copas tipo balón previamente enfriadas con hielo.</li><li>Paso 6: Completa cada copa con un toque de agua tónica helada y remueve suavemente con una cuchara de bar.</li><li>Paso 7: Decora cada copa con una rodaja fresca de pomelo rosado y sirve inmediatamente.</li></ol>
</div>
