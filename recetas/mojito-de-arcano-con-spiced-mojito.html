<div class="container">

<h1>Mojito de Arcano con Spiced Mojito</h1>
<div class="meta">
<span>Cocteleria</span>
<span class="badge badge-easy">Facil</span>
<span>15 min</span>
<span>2 porciones</span>
<span>2026-08-08</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/mojito-de-arcano-con-spiced-mojito.jpg" alt="Mojito de Arcano con Spiced Mojito" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>2 cucharadas de ron blanco</li><li>1 cucharadita de Spiced Mojito de Arcano Especias</li><li>1/2 taza de jugo de limón fresco</li><li>1/2 taza de soda de limón</li><li>Un manojo de menta fresca</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un vaso alto, mezcla el ron blanco y la cucharadita de Spiced Mojito de Arcano Especias.</li><li>Paso 2: Agrega el jugo de limón fresco y revuelve bien.</li><li>Paso 3: Llena el vaso con hielo y agrega la soda de limón.</li><li>Paso 4: Decora con un manojo de menta fresca y sirve inmediatamente.</li></ol>
</div>
