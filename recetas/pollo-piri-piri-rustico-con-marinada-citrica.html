<h1>Pollo Piri Piri Rústico con Marinada Cítrica</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-medium">Media</span>
<span>50 min</span>
<span>4 porciones</span>
<span>2026-08-25</span>
</div>
<img class="hero" src="https://arcanoespecias.com/img/recetas/pollo-piri-piri-rustico-con-marinada-citrica.jpg" alt="Pollo Piri Piri Rústico con Marinada Cítrica" loading="lazy">
<div class="content">
<h2>Ingredientes</h2>
<ul><li>1.2 kg de muslos y contramuslos de pollo con piel</li><li>2 cucharadas de Piri Piri</li><li>1 cucharada de Caribbean Citrus</li><li>4 dientes de ajo picados</li><li>3 cucharadas de aceite de oliva extra virgen</li><li>2 cucharadas de jugo de limón fresco</li><li>1 cucharada de vinagre de vino tinto</li><li>1 cucharadita de sal marina</li><li>400g de papas pequeñas cortadas a la mitad</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un tazón grande, integre el aceite de oliva, el jugo de limón, el vinagre, el ajo picado, la sal marina, el Piri Piri y el Caribbean Citrus hasta formar una marinada aromática.</li><li>Paso 2: Realice pequeños cortes en la piel del pollo para permitir que los sabores penetren profundamente en la carne.</li><li>Paso 3: Marine el pollo y las papas pequeñas en la mezcla, cubriendo cada pieza por completo, y deje reposar durante al menos 20 minutos.</li><li>Paso 4: Precaliente el horno a 200°C y distribuya el pollo junto con las papas en una bandeja para hornear.</li><li>Paso 5: Hornee durante 35 a 40 minutos, bañando el pollo a la mitad de la cocción con sus propios jugos hasta que la piel esté crujiente y dorada.</li><li>Paso 6: Retire del horno, deje reposar por 5 minutos y sirva acompañado con gajos de limón fresco.</li></ol>
</div>
