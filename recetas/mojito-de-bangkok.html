<h1>Mojito de Bangkok</h1>
<div class="meta">
<span>Cocteleria</span>
<span class="badge badge-easy">Facil</span>
<span>15 min</span>
<span>2 porciones</span>
<span>2026-07-30</span>
</div>

<div class="content">
<h2>Ingredientes</h2>
<ul><li>2 cucharaditas de azúcar</li><li>1/2 taza de ron blanco</li><li>1/2 taza de jugo de limón</li><li>1/4 cucharadita de especia Bangkok Curry de Arcano Especias</li><li>hojas de menta fresca</li><li>hielo</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: En un mortero, mezcla el azúcar y la especia Bangkok Curry hasta que estén bien combinadas.</li><li>Paso 2: En un shaker, mezcla el ron, el jugo de limón y la mezcla de azúcar y especia.</li><li>Paso 3: Agrega hielo al shaker y agita bien durante unos segundos.</li><li>Paso 4: Llena un vaso alto con hielo y vierte la mezcla del shaker.</li><li>Paso 5: Decora con hojas de menta fresca y sirve inmediatamente.</li></ol>
