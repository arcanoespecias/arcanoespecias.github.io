<body>
<div class="container">
<a href="https://arcanoespecias.com/" class="back">&larr; Volver a la tienda</a>
<h1>Tajine de Cordero con Arcano Signature</h1>
<div class="meta">
<span>Comida</span>
<span class="badge badge-medium">Media</span>
<span>1 hora 30 minutos</span>
<span>6 porciones</span>
<span>2026-08-11</span>
</div>

<div class="content">
<h2>Ingredientes</h2>
<ul><li>2 cucharaditas de Arcano Signature</li><li>500g de cordero troceado</li><li>2 cebollas picadas</li><li>3 dientes de ajo picados</li><li>1 taza de aceitunas verdes</li><li>1 taza de pasas</li><li>2 cucharadas de aceite de oliva</li><li>Sal y pimienta al gusto</li></ul>
<h2>Preparacion</h2>
<ol><li>Paso 1: Calienta el aceite de oliva en una olla grande a fuego medio.</li><li>Paso 2: Agrega el cordero y cocina hasta que esté dorado por todos lados.</li><li>Paso 3: Agrega las cebollas y el ajo y cocina hasta que estén suaves.</li><li>Paso 4: Agrega el Arcano Signature, las aceitunas verdes y las pasas, y revuelve bien.</li><li>Paso 5: Cubre la olla y cocina a fuego lento durante 1 hora.</li><li>Paso 6: Sazona con sal y pimienta al gusto.</li><li>Paso 7: Sirve el tajine caliente, decorado con perejil fresco picado.</li></ol>
</div>

<div class="footer">Arcano Especias &mdash; Especias y Blends artesanales del mundo</div>
</div>
</body>
