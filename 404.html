<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Página no encontrada | Arcano Especias</title>
<meta name="description" content="La página que buscas no existe o fue removida. Explorá nuestro catálogo de especias y blends artesanales.">
<link rel="icon" href="/icons/favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#1b0b07;color:#f0e6d3;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:560px;text-align:center}
.logo{display:inline-block;width:64px;height:64px;border-radius:50%;background:#c9a84c;margin-bottom:24px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#1b0b07;letter-spacing:-1px}
h1{font-size:5rem;color:#c9a84c;line-height:1;margin-bottom:16px;font-weight:800}
.subtitle{font-size:1.4rem;color:#f0e6d3;margin-bottom:12px;font-weight:600}
.message{color:#a08b6e;margin-bottom:32px;font-size:1rem}
.cta{display:inline-block;background:#c9a84c;color:#1b0b07;padding:14px 36px;border-radius:8px;font-weight:700;text-decoration:none;transition:transform .2s,background .2s;font-size:1rem}
.cta:hover{transform:translateY(-2px);background:#e8b84b;text-decoration:none}
.suggestions{margin-top:48px;padding-top:32px;border-top:1px solid #2d1a10;color:#6b5a42;font-size:.9rem}
.suggestions a{color:#c9a84c;text-decoration:none;margin:0 8px}
.suggestions a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<div class="logo">A</div>
<h1>404</h1>
<div class="subtitle">Este blend ya no está disponible</div>
<p class="message">El producto que buscás fue removido de nuestro catálogo o la URL cambió. Pero tenemos muchos otros blends artesanales esperándote.</p>
<a href="/" class="cta">Volver al catálogo →</a>
<div class="suggestions">
<a href="/blends-para/carnes/">Para Carnes</a>
<a href="/blends-para/infusiones/">Infusiones</a>
<a href="/blends-para/cocteleria/">Coctelería</a>
<a href="/blog/">Blog</a>
</div>
</div>
<script>
// Redirect suave después de 8 segundos si el usuario no hace nada
setTimeout(function() {
  window.location.href = '/';
}, 8000);
</script>
</body>
</html>
