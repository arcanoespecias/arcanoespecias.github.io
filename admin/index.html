<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b0b07">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Arcano Especias - Plataforma de gestion">
  <meta name="robots" content="noindex, nofollow">
  <title>Arcano Especias — Admin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-root"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- Chart.js for statistics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- Tesseract.js for OCR label reading -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- App -->
  <script src="js/db.js?v=16"></script>
  <script src="js/pdv.js?v=12"></script>
  <script src="js/pages.js?v=21"></script>
  <script src="js/seo-generator.js?v=14"></script>
  <script src="js/chatbot-panel.js?v=12"></script>
  <script src="js/whatsapp-notifications.js?v=13"></script>
  <script src="js/notificaciones-push.js?v=12"></script>
  <script src="js/core.js?v=13"></script>

  <!-- PWA Service Worker: usar el SW raíz (scope /) para que push funcione -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
      });
    }
  </script>

  <!-- Handler inline para #tk=<token>: guarda el token de GitHub en localStorage.
       Es el flujo estándar para configurar el token del admin desde la URL.
       Se ejecuta ANTES de que carguen pages.js/db.js para que estén disponibles. -->
  <script>
    (function() {
      try {
        var hash = window.location.hash || '';
        if (hash.indexOf('#tk=') === 0) {
          var token = hash.slice(4);
          if (token) {
            localStorage.setItem('arcano_gh_token', token);
            console.log('[Auth] Token de GitHub guardado en localStorage desde URL hash.');
          }
          // Limpiar el hash para que no quede visible en la URL
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      } catch (e) {
        console.warn('[Auth] Error procesando hash #tk=:', e);
      }
    })();
  </script>
</body>
</html>
